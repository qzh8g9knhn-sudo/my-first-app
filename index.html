<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Translate</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">🌐</span>
        <h1>Translate</h1>
      </div>
      <button id="themeToggle" class="icon-button" type="button" aria-label="Toggle appearance">
        <span aria-hidden="true">◐</span>
      </button>
    </header>

    <section class="language-bar" aria-label="Language selection">
      <div class="language-field">
        <label for="sourceLanguage">From</label>
        <select id="sourceLanguage">
          <option value="auto" selected>Auto-detect</option>
          <option value="en">English</option>
          <option value="ar">Arabic</option>
          <option value="fr">French</option>
          <option value="de">German</option>
          <option value="es">Spanish</option>
          <option value="tr">Turkish</option>
          <option value="zh-CN">Chinese</option>
        </select>
      </div>

      <button id="swapLanguages" class="icon-button swap" type="button" aria-label="Swap languages">
        ⇄
      </button>

      <div class="language-field">
        <label for="targetLanguage">To</label>
        <select id="targetLanguage">
          <option value="ar" selected>Arabic</option>
          <option value="en">English</option>
          <option value="fr">French</option>
          <option value="de">German</option>
          <option value="es">Spanish</option>
          <option value="tr">Turkish</option>
          <option value="zh-CN">Chinese</option>
        </select>
      </div>
    </section>

    <section class="cards">
      <article class="card">
        <div class="card-top">
          <span class="card-label">Source text</span>
          <button id="clearInput" class="text-button" type="button">Clear</button>
        </div>
        <textarea id="sourceText" placeholder="Enter text" spellcheck="false"></textarea>
        <div class="card-actions">
          <button id="copySource" class="action-button" type="button">Copy</button>
          <button id="speakSource" class="action-button" type="button">Listen</button>
        </div>
      </article>

      <article class="card output">
        <div class="card-top">
          <span class="card-label">Translation</span>
          <span id="status" class="status" role="status"></span>
        </div>
        <textarea id="targetText" placeholder="Translation" readonly></textarea>
        <div class="card-actions">
          <button id="copyTarget" class="action-button" type="button">Copy</button>
          <button id="speakTarget" class="action-button" type="button">Listen</button>
        </div>
      </article>
    </section>

    <p class="footer">Powered by MyMemory · Works best in Chrome, Edge, or Safari</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
