<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#0071e3" />
  <meta name="description" content="A minimalist, fast translation app. Translate text between many languages with text-to-speech support." />
  <title>Translate</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="header">
      <button id="settingsBtn" class="icon-button" type="button" aria-label="Settings">
        ⚙️
      </button>
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">🌐</span>
        <h1>Translate</h1>
      </div>
      <button id="swapLanguages" class="icon-button" type="button" aria-label="Swap languages">
        ⇄
      </button>
    </header>

    <section class="cards">
      <article class="card">
        <div class="card-top">
          <select id="sourceLanguage" class="card-language">
            <option value="auto" selected>Auto-detect</option>
            <option value="en">English</option>
            <option value="ar">العربية</option>
            <option value="fr">Français</option>
            <option value="de">Deutsch</option>
            <option value="es">Español</option>
            <option value="tr">Türkçe</option>
            <option value="zh-CN">中文</option>
            <option value="it">Italiano</option>
            <option value="pt">Português</option>
            <option value="ru">Русский</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
            <option value="hi">हिन्दी</option>
            <option value="nl">Nederlands</option>
            <option value="pl">Polski</option>
            <option value="sv">Svenska</option>
            <option value="id">Bahasa Indonesia</option>
          </select>
          <button id="clearInput" class="text-button" type="button">Clear</button>
        </div>
        <textarea id="sourceText" placeholder="Enter text or tap the mic" spellcheck="false"></textarea>
        <div class="card-actions">
          <button id="micSource" class="action-button" type="button">🎙️ Mic</button>
          <button id="copySource" class="action-button" type="button">Copy</button>
          <button id="speakSource" class="action-button" type="button">🔊</button>
        </div>
      </article>

      <article class="card output">
        <div class="card-top">
          <select id="targetLanguage" class="card-language">
            <option value="ar" selected>العربية</option>
            <option value="en">English</option>
            <option value="fr">Français</option>
            <option value="de">Deutsch</option>
            <option value="es">Español</option>
            <option value="tr">Türkçe</option>
            <option value="zh-CN">中文</option>
            <option value="it">Italiano</option>
            <option value="pt">Português</option>
            <option value="ru">Русский</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
            <option value="hi">हिन्दी</option>
            <option value="nl">Nederlands</option>
            <option value="pl">Polski</option>
            <option value="sv">Svenska</option>
            <option value="id">Bahasa Indonesia</option>
          </select>
          <span id="status" class="status" role="status"></span>
        </div>
        <textarea id="targetText" placeholder="Translation" readonly></textarea>
        <div class="card-actions">
          <button id="copyTarget" class="action-button" type="button">Copy</button>
          <button id="speakTarget" class="action-button" type="button">🔊 Listen</button>
        </div>
      </article>
    </section>

    <p class="footer">Powered by MyMemory</p>
  </main>

  <!-- Settings Modal -->
  <div id="settingsModal" class="modal hidden">
    <div class="modal-content">
      <header class="modal-header">
        <h2>Settings</h2>
        <button id="closeSettings" class="icon-button" type="button" aria-label="Close">✕</button>
      </header>
      <div class="modal-body">
        <div class="setting-item">
          <label for="appLanguage">App Language</label>
          <select id="appLanguage">
            <option value="en">English</option>
            <option value="ar">العربية</option>
            <option value="de">Deutsch</option>
          </select>
        </div>
        <div class="setting-item">
          <label>Appearance</label>
          <div class="theme-options">
            <button data-theme="light" class="theme-btn">Light</button>
            <button data-theme="dark" class="theme-btn">Dark</button>
            <button data-theme="auto" class="theme-btn active">Auto</button>
          </div>
        </div>
        <div class="setting-item">
          <a href="#" id="termsLink">Terms of Service</a>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then((reg) => console.log('Service Worker registered', reg))
          .catch((err) => console.error('Service Worker registration failed', err));
      });
    }
  </script>
</body>
</html>
